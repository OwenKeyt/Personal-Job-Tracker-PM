name: pm-watch

on:
  schedule:
    # Every 30 minutes. GitHub's cron is best-effort and often runs 5-15 min
    # late under load — treat "30 min" as "usually under an hour".
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      test_ping:
        description: "Send a test notification to your phone right now"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: pm-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Check for new roles
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          TEST_PING: ${{ inputs.test_ping }}
        run: node check.mjs

      - name: Persist seen state
        run: |
          git config user.name  "pm-watch"
          git config user.email "pm-watch@users.noreply.github.com"
          git add state/seen.json
          git diff --staged --quiet || git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push

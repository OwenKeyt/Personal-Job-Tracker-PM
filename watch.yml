name: pm-watch

on:
  schedule:
    # Every 30 minutes. GitHub's cron is best-effort and often runs 5-15 min
    # late during peak load — treat "30 min" as "usually under an hour".
    - cron: "*/30 * * * *"
  workflow_dispatch: # manual run button in the Actions tab

permissions:
  contents: write # needed to commit state/seen.json back

concurrency:
  group: pm-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check for new roles
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: node check.mjs

      - name: Persist seen state
        run: |
          git config user.name  "pm-watch"
          git config user.email "pm-watch@users.noreply.github.com"
          git add state/seen.json
          git diff --staged --quiet || git commit -m "state: $(date -u +%Y-%m-%dT%H:%MZ)"
          # Another run may have pushed while we worked; rebase rather than fail.
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push
